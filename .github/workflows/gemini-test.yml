# Gemini（確かめる担当）につながるかを試す（手動でだけ動かす）
name: Gemini の接続テスト
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 1回だけ確かめてもらう
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHECKER_MODEL: ${{ vars.CHECKER_MODEL }}
        run: |
          python - <<'PY'
          import sys, json
          sys.path.insert(0, "pipeline")
          import ai
          system = open("prompts/check_law.md", encoding="utf-8").read().split("---", 1)[1]
          user = ("【元の資料】\n件名：建築士法の一部を改正する法律案\n【議案要旨】\n二級建築士として四年以上の実務経験を有する者に一級建築士試験の受験資格を与える。施行は公布の日から起算して一年を経過した日。\n\n"
                  "【書かれた記事】\n" + json.dumps({"title": "建築士法の画期的な改正",
                  "lead": {l: "二級建築士が一級建築士試験を受けやすくなる法律。" for l in ("es", "hs", "std", "univ")},
                  "facts": [{l: "二級建築士として4年以上の実務経験がある人に、一級建築士試験の受験資格を与える。施行は公布の日から2年後。" for l in ("es", "hs", "std", "univ")}]}, ensure_ascii=False))
          import os, time, urllib.request
          for m in ["gemini-3.8-flash", "gemini-flash-lite-latest"]:
              t0 = time.time()
              try:
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent"
                  body = {"systemInstruction": {"parts": [{"text": system}]}, "contents": [{"role": "user", "parts": [{"text": user}]}],
                          "generationConfig": {"responseMimeType": "application/json", "temperature": 0}}
                  res = ai._post(url, {"content-type": "application/json", "x-goog-api-key": os.environ["GEMINI_API_KEY"]}, body, timeout=200)
                  text = res["candidates"][0]["content"]["parts"][0]["text"]
                  print(f"== {m} → {res.get('modelVersion')}（{time.time()-t0:.0f}秒）")
                  print(json.dumps(ai.extract_json(text), ensure_ascii=False)[:600])
              except Exception as e:
                  print(f"== {m} 失敗（{time.time()-t0:.0f}秒）：{type(e).__name__} {getattr(e, 'code', '')} {str(e)[:200]}")
                  if hasattr(e, "read"):
                      print(e.read()[:400])
          PY
