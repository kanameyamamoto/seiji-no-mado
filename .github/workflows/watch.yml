# 週に1回、すべてのページの出典（約700）を見に行き、変わったものを「見直し待ち」にする。
# 実際の見直しは、毎日の更新（update.yml）が少しずつ行う。
# あわせて、政府・国会・政党の公式サイトとSNSのリンクを集め直す（accounts.py・ルール D-11）。
name: 出典の見張り

on:
  schedule:
    - cron: "17 18 * * 6"   # 毎週日曜 日本時間 3:17（UTC 土曜 18:17）
  workflow_dispatch:
    inputs:
      rebaseline:
        description: "今の出典を基準として記録するだけにする（見直し待ちにはしない）。最初の1回や、比べ方を変えたときに使う"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # 手動・定時のどちらでも、いちばん新しい main から始める
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && (command -v pdftotext || sudo apt-get install -y -q poppler-utils)
      - name: 出典を見に行く
        run: python pipeline/watch_sources.py ${{ inputs.rebaseline && '--rebaseline' || '' }}
      - name: 公式サイト・SNSを集め直す（D-11）
        continue-on-error: true   # 失敗しても、前回の結果のまま出典の見張りは保存する
        run: pip install -q playwright && python -m playwright install --with-deps chromium && python pipeline/accounts.py
      - name: 人が見る必要があるものを知らせる
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/report.py
      - name: 記録を保存する
        run: |
          git config user.name "seiji-no-mado-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "出典の見張り $(TZ=Asia/Tokyo date +%Y-%m-%d)"; git pull --rebase -q origin main; git push; }
