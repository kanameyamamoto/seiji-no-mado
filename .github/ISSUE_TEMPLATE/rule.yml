name: ルール変更の提案
description: 書き方・並べ方のルールを足す・変える・消す提案（ルールT-1）
title: "ルール：<ルール番号 または 新しいルール>"
labels: ["ルール"]
body:
  - type: input
    id: rule
    attributes:
      label: 対象のルール
      description: 例：V-1、D-4。新しいルールなら「新規」
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 変更案
      description: 変えたあとのルールの文
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由
      description: なぜ変えるとよいか。偏りが減る・分かりやすくなる、など
    validations:
      required: true
