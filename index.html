<style>
/* Layout: fixed navy header + content column (max 1040px) + fixed navy bottom tabs on phones / tabs in header on desktop. Institutional navy (紺) with white cards; party colors never used (rule D-2). */
:root {
  --bg: #EEF1F6;
  --surface: #FFFFFF;
  --panel: #E3E8F0;
  --line: #D3DAE5;
  --fg: #13213A;
  --muted: #4A5872;
  --accent: #1F3F7A;
  --accent-weak: #DCE4F2;
  --bar: #6D82A8;
  --nav-bg: #14264A;
  --nav-fg: #FFFFFF;
  --nav-muted: #A9B6CF;
  --nav-weak: #26396A;
  --font-ui: 'BIZ UDPGothic', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif;
  --font-head: 'Zen Kaku Gothic New', 'BIZ UDPGothic', 'Hiragino Sans', sans-serif;
  --r: 14px;
  --gap: 16px;
  --header-h: 60px;
  --tabs-h: 64px;
}
:root, :root[data-theme="dark"] { color-scheme: light; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--nav-bg); }
a { color: var(--accent); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-head); font-weight: 700; line-height: 1.4; text-wrap: balance; margin: 0; }
p, ul, ol { margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--nav-bg); }
.top .wrap { height: var(--header-h); display: flex; align-items: center; gap: 24px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-head); font-weight: 700; font-size: 19px; color: var(--nav-fg); text-decoration: none; }

.nav-desk { display: none; gap: 4px; margin-left: 8px; }
.nav-desk button { padding: 8px 14px; border-radius: 999px; color: var(--nav-muted); font-size: 15px; }
.nav-desk button[aria-current="page"] { color: var(--nav-fg); background: var(--nav-weak); font-weight: 700; }
.top-actions { margin-left: auto; display: flex; gap: 4px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 999px; color: var(--nav-muted); }
.icon-btn:hover { background: var(--nav-weak); color: var(--nav-fg); }
.sheet .icon-btn { color: var(--muted); }
.sheet .icon-btn:hover { background: var(--panel); color: var(--fg); }
.icon-btn svg { width: 22px; height: 22px; }

/* bottom tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--nav-bg);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .row { display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabs-h); }
nav.tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--nav-muted); }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--nav-fg); font-weight: 700; }
main { padding-block: 24px 40px; }
@media (min-width: 900px) {
  .nav-desk { display: flex; }
  nav.tabs { display: none; }
  main { padding-block: 32px 56px; }

}

/* common blocks */

/* feed */

/* article */
.facts { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.fact { display: flex; flex-direction: column; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--line); }

.fact .note { font-size: 14px; color: var(--muted); }
.votes { display: grid; grid-template-columns: 1fr; gap: var(--gap); }
@media (min-width: 720px) { .votes, .views { grid-template-columns: 1fr 1fr; } }
.vote-col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
.vote-col h3 { font-size: 16px; display: flex; justify-content: space-between; }
.vote-col ul { padding-left: 1.2em; color: var(--fg); font-size: 15px; }
.views { display: grid; grid-template-columns: 1fr; gap: var(--gap); }
.view-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.view-card h3 { font-size: 17px; }
.view-card .origin { font-size: 13px; color: var(--muted); }
.view-card .foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.think { padding: 24px; border-radius: var(--r); background: var(--accent-weak); display: flex; flex-direction: column; gap: 6px; }
.think h2 { font-size: 22px; color: var(--accent); }

/* learn */
.learn-body { display: flex; flex-direction: column; gap: 20px; max-width: 860px; }
.learn-body ul { padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.learn-body .lt { font-weight: 700; margin-bottom: 6px; }
.table-wrap { background: var(--surface); overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th { background: var(--panel); font-weight: 700; }

.steps { display: flex; flex-direction: column; gap: 0; }
.step { display: grid; grid-template-columns: 40px 1fr; gap: 14px; }

.step .dot b { width: 32px; height: 32px; border-radius: 999px; background: var(--accent); color: var(--surface); display: grid; place-items: center; font-size: 14px; }

/* charts */
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(0, 11em) 1fr 8.5em; gap: 12px; align-items: center; font-size: 14px; }
.bar .label { overflow-wrap: anywhere; }
.bar .track { height: 14px; background: var(--panel); border-radius: 999px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--bar); border-radius: 999px; }

.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.box h3 { font-size: 18px; }
.gap-viz { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.big { font-family: var(--font-head); font-size: 44px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }

.stat { display: flex; flex-direction: column; gap: 4px; }

.grid-fields { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 720px) { .grid-fields { grid-template-columns: repeat(3, 1fr); } }
.field { background: var(--surface); padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; display: flex; gap: 10px; }

.two { display: grid; grid-template-columns: 1fr; gap: var(--gap); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 16, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 85%; overflow: auto; border-radius: 20px 20px 0 0;
  padding: 20px max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 900px) { .scrim { align-items: center; } .sheet { border-radius: 20px; } }
.sheet .sh { display: flex; align-items: flex-start; gap: 12px; }
.sheet .sh h2 { font-size: 20px; flex: 1; }
.opt-group { display: flex; flex-wrap: wrap; gap: 8px; }

.opt[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-weak); font-weight: 700; }
.rules-group { display: flex; flex-direction: column; gap: 10px; }

.rule-row { display: grid; grid-template-columns: 3.6em 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.rule-row b { font-variant-numeric: tabular-nums; color: var(--accent); }
.rule-row .rt { font-weight: 700; }
.rule-row .rx { color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(16px); opacity: .6; } } }

/* v5 additions */
th, td { white-space: normal; min-width: 8.5em; vertical-align: top; }

.seg { flex-wrap: wrap; }

.note-b { font-size: 14px; color: var(--muted); padding: 12px 16px; border-left: 3px solid var(--line); background: var(--surface); border-radius: 0 10px 10px 0; }
.cert { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: var(--panel); color: var(--muted); }

.sec { scroll-margin-top: calc(var(--header-h) + 16px); }
